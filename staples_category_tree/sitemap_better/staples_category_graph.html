<title>Staples Category Graph</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#0a0d12;
    --panel:#10151d;
    --panel-border:#212a37;
    --text:#dbe2ec;
    --text-dim:#7c8797;
    --text-faint:#4b5563;
    --accent:#ff5f4d;
    --l1:#ff5f4d;
    --l2:#4fc3f7;
    --l3:#7ee787;
    --l4:#f2c14e;
    --broken:#ff4d6d;
    --edge:rgba(130,150,180,0.16);
    --edge-strong:rgba(255,95,77,0.55);
    --edge-cross:rgba(167,139,250,0.45);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#0a0d12; --panel:#10151d; --panel-border:#212a37; --text:#dbe2ec; --text-dim:#7c8797; --text-faint:#4b5563;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Manrope',sans-serif;
    overflow:hidden;
    position:relative;
  }
  #canvas-wrap{position:fixed; inset:0;}
  canvas{display:block; width:100%; height:100%; cursor:grab;}
  canvas.dragging{cursor:grabbing;}

  .panel{
    position:fixed;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    backdrop-filter:blur(6px);
    box-shadow:0 8px 30px rgba(0,0,0,0.45);
  }

  #header{
    top:16px; left:16px; padding:14px 16px;
    max-width:320px;
  }
  #header h1{
    margin:0 0 2px; font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700;
    letter-spacing:-0.01em; color:var(--text);
  }
  #header .sub{font-size:11.5px; color:var(--text-dim); line-height:1.5; margin-bottom:10px;}
  #stats{display:flex; gap:14px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim);}
  #stats b{color:var(--text); font-weight:700; display:block; font-size:15px; font-variant-numeric:tabular-nums;}

  #search-wrap{margin-top:12px; position:relative;}
  #search{
    width:100%; background:#161d28; border:1px solid var(--panel-border); color:var(--text);
    padding:8px 10px; border-radius:7px; font-family:'Manrope'; font-size:12.5px; outline:none;
  }
  #search:focus{border-color:var(--accent);}
  #search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0; max-height:220px; overflow-y:auto;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:8px; z-index:20;
    display:none;
  }
  #search-results.show{display:block;}
  .sr-item{padding:7px 10px; font-size:12px; cursor:pointer; border-bottom:1px solid var(--panel-border); display:flex; justify-content:space-between; gap:8px;}
  .sr-item:last-child{border-bottom:none;}
  .sr-item:hover{background:#1a2230;}
  .sr-item .lv{font-family:'JetBrains Mono',monospace; font-size:9px; padding:1px 5px; border-radius:4px; flex-shrink:0;}

  #l1-list{
    top:16px; right:16px; width:270px; padding:12px 14px 14px;
    max-height:calc(100vh - 32px); display:flex; flex-direction:column;
  }
  #l1-list h2{margin:0 0 8px; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.06em; color:var(--text-dim); text-transform:uppercase; font-weight:500;}
  #l1-scroll{overflow-y:auto; display:flex; flex-direction:column; gap:2px; padding-right:2px;}
  .l1-chip{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer;
    font-size:12px; color:var(--text-dim); border:1px solid transparent; line-height:1.3;
  }
  .l1-chip:hover{background:#161d28; color:var(--text);}
  .l1-chip.active{background:rgba(255,95,77,0.12); border-color:rgba(255,95,77,0.4); color:var(--text);}
  .l1-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--l1); flex-shrink:0;}
  .l1-chip .cnt{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-faint); flex-shrink:0;}

  #legend{
    bottom:16px; left:16px; padding:11px 14px; display:flex; flex-direction:column; gap:6px;
  }
  .leg-row{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-dim);}
  .leg-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .leg-row .key{font-family:'JetBrains Mono',monospace; color:var(--text-faint); margin-left:auto; font-size:10px;}

  #detail{
    top:16px; right:16px; width:300px; padding:16px; display:none;
  }
  #detail.show{display:block;}
  #detail .close{position:absolute; top:10px; right:12px; cursor:pointer; color:var(--text-faint); font-size:16px; line-height:1;}
  #detail .close:hover{color:var(--text);}
  #detail .lv-badge{
    display:inline-block; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700;
    padding:2px 7px; border-radius:5px; margin-bottom:10px;
  }
  #detail h3{margin:0 0 10px; font-size:15px; line-height:1.35; font-weight:700; padding-right:16px;}
  #detail .url{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-dim); word-break:break-all;
    background:#161d28; padding:8px; border-radius:6px; margin-bottom:10px; line-height:1.5;
  }
  #detail .note{font-size:12px; color:#ffb199; line-height:1.55; background:rgba(255,95,77,0.08); border:1px solid rgba(255,95,77,0.25); padding:9px 10px; border-radius:7px; margin-bottom:10px;}
  #detail .meta-row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); padding:5px 0; border-top:1px solid var(--panel-border);}
  #detail .meta-row b{color:var(--text); font-family:'JetBrains Mono',monospace; font-weight:500;}

  #zoom-controls{
    bottom:16px; right:16px; display:flex; flex-direction:column; overflow:hidden; padding:0;
  }
  #zoom-controls button{
    width:34px; height:34px; background:transparent; border:none; color:var(--text-dim); cursor:pointer;
    font-size:16px; font-family:'JetBrains Mono',monospace; border-bottom:1px solid var(--panel-border);
  }
  #zoom-controls button:last-child{border-bottom:none;}
  #zoom-controls button:hover{background:#161d28; color:var(--text);}

  #hint{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    font-size:11px; color:var(--text-faint); font-family:'JetBrains Mono',monospace;
    pointer-events:none; opacity:0.8;
  }

  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:#2a3444; border-radius:3px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>

<div id="canvas-wrap"><canvas id="cv"></canvas></div>

<div class="panel" id="header">
  <h1>Staples Category Graph</h1>
  <div class="sub">Live map of the site's L1&rarr;L2&rarr;L3&rarr;L4 category hierarchy, rebuilt from the sitemap crawl.</div>
  <div id="stats">
    <div><b id="stat-nodes">0</b>nodes</div>
    <div><b id="stat-links">0</b>edges</div>
    <div><b id="stat-l1">0</b>L1 sections</div>
  </div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search category or URL...&#8203;" autocomplete="off"/>
    <div id="search-results"></div>
  </div>
</div>

<div class="panel" id="l1-list">
  <h2>L1 Sections</h2>
  <div id="l1-scroll"></div>
</div>

<div class="panel" id="legend">
  <div class="leg-row"><span class="leg-dot" style="background:var(--l1)"></span>L1 &mdash; bolded section<span class="key">SC</span></div>
  <div class="leg-row"><span class="leg-dot" style="background:var(--l2)"></span>L2 <span class="key">CG&nbsp;/&nbsp;CL</span></div>
  <div class="leg-row"><span class="leg-dot" style="background:var(--l3)"></span>L3<span class="key">CG&nbsp;/&nbsp;CL</span></div>
  <div class="leg-row"><span class="leg-dot" style="background:var(--l4)"></span>L4<span class="key">CL</span></div>
  <div class="leg-row"><span class="leg-dot" style="background:var(--broken)"></span>broken / flagged</div>
</div>

<div class="panel" id="detail">
  <span class="close" id="detail-close">&times;</span>
  <div id="detail-body"></div>
</div>

<div class="panel" id="zoom-controls">
  <button id="zoom-in">+</button>
  <button id="zoom-out">&minus;</button>
  <button id="zoom-reset">&#9678;</button>
</div>

<div id="hint">drag to pan &middot; scroll to zoom &middot; click a node &middot; click a URL to open it</div>

const LEVEL_COLOR = {1:'#ff5f4d', 2:'#4fc3f7', 3:'#7ee787', 4:'#f2c14e'};
const LEVEL_RADIUS = {1:11, 2:7, 3:5, 4:4};

function isBroken(n){ return !n.url || (n.note && /BROKEN/i.test(n.note)); }

const nodes = RAW.nodes.map(n => ({
  ...n,
  r: LEVEL_RADIUS[n.level] || 4,
  color: isBroken(n) ? '#ff4d6d' : (LEVEL_COLOR[n.level] || '#8b98ab'),
}));
const nodeById = new Map(nodes.map(n => [n.id, n]));
const links = RAW.links
  .filter(l => nodeById.has(l.source) && nodeById.has(l.target))
  .map(l => ({...l}));

// mark links that are cross-references (target already has another parent earlier in list)
const seenAsTarget = new Set();
links.forEach(l => {
  l.cross = seenAsTarget.has(l.target);
  seenAsTarget.add(l.target);
});

document.getElementById('stat-nodes').textContent = nodes.length;
document.getElementById('stat-links').textContent = links.length;
const l1Nodes = nodes.filter(n => n.level === 1);
document.getElementById('stat-l1').textContent = l1Nodes.length;

// ---------- canvas + zoom setup ----------
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('canvas-wrap');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
window.addEventListener('resize', resize);

let transform = d3.zoomIdentity;
const zoom = d3.zoom()
  .scaleExtent([0.08, 6])
  .on('zoom', (ev) => { transform = ev.transform; draw(); });

d3.select(canvas).call(zoom).on('dblclick.zoom', null);

// ---------- force simulation ----------
const childCount = new Map();
links.forEach(l => childCount.set(l.source, (childCount.get(l.source)||0) + 1));

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(l => l.cross ? 90 : (36 + (nodeById.get(l.source)?.level||1)*10)).strength(l => l.cross ? 0.05 : 0.45))
  .force('charge', d3.forceManyBody().strength(d => d.level===1 ? -420 : (d.level===2 ? -140 : -50)))
  .force('collide', d3.forceCollide().radius(d => d.r + 3).strength(0.9))
  .force('center', d3.forceCenter(0,0))
  .force('x', d3.forceX(0).strength(0.02))
  .force('y', d3.forceY(0).strength(0.02))
  .alpha(1)
  .alphaDecay(0.018);

let highlightSet = null; // set of node ids to keep opaque; others dim
let hoveredNode = null;
let selectedNode = null;

function nodeScreenPos(n){
  return {x: transform.applyX(n.x), y: transform.applyY(n.y)};
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();

  // links
  ctx.lineWidth = 1;
  links.forEach(l => {
    const s = l.source, t = l.target;
    if (s.x === undefined || t.x === undefined) return;
    let show = true;
    if (highlightSet) show = highlightSet.has(s.id) && highlightSet.has(t.id);
    const sp = nodeScreenPos(s), tp = nodeScreenPos(t);
    ctx.beginPath();
    ctx.moveTo(sp.x, sp.y);
    ctx.lineTo(tp.x, tp.y);
    if (l.cross){
      ctx.strokeStyle = show ? 'rgba(167,139,250,0.55)' : 'rgba(167,139,250,0.06)';
      ctx.setLineDash([3,3]);
    } else {
      ctx.strokeStyle = show ? 'rgba(130,150,180,0.28)' : 'rgba(130,150,180,0.04)';
      ctx.setLineDash([]);
    }
    ctx.stroke();
  });
  ctx.setLineDash([]);

  // nodes
  const k = transform.k;
  nodes.forEach(n => {
    if (n.x === undefined) return;
    const p = nodeScreenPos(n);
    if (p.x < -40 || p.x > W+40 || p.y < -40 || p.y > H+40) return;
    let show = true;
    if (highlightSet) show = highlightSet.has(n.id);
    const r = n.r * k;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(r,1.4), 0, Math.PI*2);
    ctx.fillStyle = show ? n.color : 'rgba(120,130,145,0.18)';
    ctx.globalAlpha = show ? 1 : 1;
    ctx.fill();
    if (n === selectedNode || n === hoveredNode){
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    // labels: show for L1 always (if zoomed enough), others when zoomed in or hovered/selected
    const showLabel = (n.level===1 && k > 0.15) || ((n.level<=2) && k > 0.55) || (k > 1.3) || n===hoveredNode || n===selectedNode;
    if (showLabel && show){
      ctx.font = (n.level===1 ? '700 ' : '500 ') + Math.max(9, Math.min(13, 10*Math.min(k,1.4))) + 'px Manrope, sans-serif';
      ctx.fillStyle = n.level===1 ? '#f2f5f9' : '#c3cbd6';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.label, p.x + r + 4, p.y);
    }
  });

  ctx.restore();
}

simulation.on('tick', draw);

// ---------- interaction: drag ----------
let draggingNode = null;
function toWorld(px, py){
  return {x: transform.invertX(px), y: transform.invertY(py)};
}
function findNodeAt(px, py){
  const w = toWorld(px, py);
  let best = null, bestD = Infinity;
  for (const n of nodes){
    if (n.x === undefined) continue;
    const dx = n.x - w.x, dy = n.y - w.y;
    const d = Math.sqrt(dx*dx+dy*dy);
    const hitR = n.r + 4/transform.k;
    if (d < hitR && d < bestD){ bestD = d; best = n; }
  }
  return best;
}

let dragStart = null;
canvas.addEventListener('pointerdown', (ev) => {
  const rect = canvas.getBoundingClientRect();
  const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  const n = findNodeAt(px, py);
  if (n){
    draggingNode = n;
    simulation.alphaTarget(0.25).restart();
    n.fx = n.x; n.fy = n.y;
    canvas.setPointerCapture(ev.pointerId);
    ev.stopPropagation();
  }
});
canvas.addEventListener('pointermove', (ev) => {
  const rect = canvas.getBoundingClientRect();
  const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  if (draggingNode){
    const w = toWorld(px, py);
    draggingNode.fx = w.x; draggingNode.fy = w.y;
  } else {
    const n = findNodeAt(px, py);
    if (n !== hoveredNode){ hoveredNode = n; canvas.style.cursor = n ? 'pointer' : 'grab'; draw(); }
  }
});
function endDrag(ev){
  if (draggingNode){
    draggingNode.fx = null; draggingNode.fy = null;
    simulation.alphaTarget(0);
    draggingNode = null;
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointerleave', endDrag);

canvas.addEventListener('click', (ev) => {
  if (dragMoved) { dragMoved = false; return; }
  const rect = canvas.getBoundingClientRect();
  const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
  const n = findNodeAt(px, py);
  selectNode(n);
});
let dragMoved = false;
canvas.addEventListener('pointerdown', () => dragMoved = false);
canvas.addEventListener('pointermove', (ev) => { if (ev.buttons) dragMoved = true; });

// ---------- selection / detail panel ----------
const detailPanel = document.getElementById('detail');
const detailBody = document.getElementById('detail-body');
document.getElementById('detail-close').addEventListener('click', () => { selectNode(null); });

function levelBadgeStyle(level){
  const c = LEVEL_COLOR[level] || '#8b98ab';
  return `background:${c}22; color:${c}; border:1px solid ${c}55;`;
}

function ancestorAndDescendantIds(n){
  const set = new Set([n.id]);
  // ancestors
  let frontier = [n.id];
  const parentOf = new Map();
  links.forEach(l => { if(!parentOf.has(l.target.id)) parentOf.set(l.target.id, []); parentOf.get(l.target.id).push(l.source.id); });
  const childOf = new Map();
  links.forEach(l => { if(!childOf.has(l.source.id)) childOf.set(l.source.id, []); childOf.get(l.source.id).push(l.target.id); });
  let stack = [n.id];
  while(stack.length){
    const cur = stack.pop();
    (parentOf.get(cur)||[]).forEach(p => { if(!set.has(p)){ set.add(p); stack.push(p);} });
  }
  stack = [n.id];
  while(stack.length){
    const cur = stack.pop();
    (childOf.get(cur)||[]).forEach(c => { if(!set.has(c)){ set.add(c); stack.push(c);} });
  }
  return set;
}

function selectNode(n){
  selectedNode = n;
  if (!n){
    detailPanel.classList.remove('show');
    highlightSet = null;
    draw();
    return;
  }
  highlightSet = ancestorAndDescendantIds(n);
  const childCnt = links.filter(l => l.source.id === n.id).length;
  const parentLinks = links.filter(l => l.target.id === n.id);
  const levelName = ['','L1 &mdash; bolded section','L2','L3','L4'][n.level] || ('L'+n.level);
  let html = `<span class="lv-badge" style="${levelBadgeStyle(n.level)}">${levelName}</span>`;
  html += `<h3>${escapeHtml(n.label)}</h3>`;
  if (n.url){
    html += `<div class="url" style="cursor:pointer" onclick="window.open('${n.url}','_blank')">${escapeHtml(n.url)} &nearr;</div>`;
  } else {
    html += `<div class="url" style="color:#ff8b95">no valid URL on this node</div>`;
  }
  if (n.note){
    html += `<div class="note">${escapeHtml(n.note)}</div>`;
  }
  html += `<div class="meta-row"><span>children</span><b>${childCnt}</b></div>`;
  html += `<div class="meta-row"><span>incoming links</span><b>${parentLinks.length}</b></div>`;
  if (parentLinks.length > 1){
    html += `<div class="meta-row"><span>reached from</span><b>${parentLinks.length} parents</b></div>`;
  }
  detailBody.innerHTML = html;
  detailPanel.classList.add('show');
  draw();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- L1 chip list ----------
const l1Scroll = document.getElementById('l1-scroll');
l1Nodes.sort((a,b) => a.label.localeCompare(b.label));
l1Nodes.forEach(n => {
  const cnt = links.filter(l => l.source.id === n.id).length;
  const chip = document.createElement('div');
  chip.className = 'l1-chip';
  chip.innerHTML = `<span class="dot"></span><span>${escapeHtml(n.label)}</span><span class="cnt">${cnt}</span>`;
  chip.addEventListener('click', () => {
    const isActive = chip.classList.contains('active');
    document.querySelectorAll('.l1-chip').forEach(c => c.classList.remove('active'));
    if (isActive){
      highlightSet = null; selectedNode = null; detailPanel.classList.remove('show');
    } else {
      chip.classList.add('active');
      highlightSet = ancestorAndDescendantIds(n);
      selectNode(n);
    }
    draw();
    focusOnNodes(highlightSet);
  });
  l1Scroll.appendChild(chip);
});

function focusOnNodes(idSet){
  if (!idSet) return;
  const pts = nodes.filter(n => idSet.has(n.id) && n.x !== undefined);
  if (!pts.length) return;
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  const spanX = Math.max(maxX-minX, 80), spanY = Math.max(maxY-minY, 80);
  const scale = Math.min(3, 0.8*Math.min(W/spanX, H/spanY));
  const t = d3.zoomIdentity.translate(W/2, H/2).scale(scale).translate(-cx, -cy);
  d3.select(canvas).transition().duration(600).call(zoom.transform, t);
}

// ---------- search ----------
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2){ searchResults.classList.remove('show'); searchResults.innerHTML=''; return; }
  const matches = nodes.filter(n => n.label.toLowerCase().includes(q) || (n.url||'').toLowerCase().includes(q)).slice(0, 25);
  if (!matches.length){ searchResults.innerHTML = '<div class="sr-item" style="color:#7c8797">no matches</div>'; searchResults.classList.add('show'); return; }
  searchResults.innerHTML = matches.map(n => {
    const c = LEVEL_COLOR[n.level] || '#8b98ab';
    return `<div class="sr-item" data-id="${encodeURIComponent(n.id)}"><span>${escapeHtml(n.label)}</span><span class="lv" style="background:${c}22;color:${c}">L${n.level}</span></div>`;
  }).join('');
  searchResults.classList.add('show');
});
searchResults.addEventListener('click', (ev) => {
  const item = ev.target.closest('.sr-item');
  if (!item || !item.dataset.id) return;
  const id = decodeURIComponent(item.dataset.id);
  const n = nodeById.get(id);
  if (n){
    document.querySelectorAll('.l1-chip').forEach(c => c.classList.remove('active'));
    highlightSet = null;
    selectNode(n);
    setTimeout(() => focusOnNodes(new Set([n.id])), 50);
  }
  searchResults.classList.remove('show');
});
document.addEventListener('click', (ev) => {
  if (!ev.target.closest('#search-wrap')) searchResults.classList.remove('show');
});

// ---------- zoom controls ----------
document.getElementById('zoom-in').addEventListener('click', () => d3.select(canvas).transition().duration(250).call(zoom.scaleBy, 1.4));
document.getElementById('zoom-out').addEventListener('click', () => d3.select(canvas).transition().duration(250).call(zoom.scaleBy, 1/1.4));
document.getElementById('zoom-reset').addEventListener('click', () => {
  document.querySelectorAll('.l1-chip').forEach(c => c.classList.remove('active'));
  highlightSet = null; selectNode(null);
  d3.select(canvas).transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2).scale(0.35));
});

// initial view
setTimeout(() => {
  d3.select(canvas).call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2).scale(0.28));
}, 50);
</script>
